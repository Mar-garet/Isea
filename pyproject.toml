[project]


name = "isea"
version = "0.1.0"
description = "Repository-level repair agents for SWE-bench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chardet>=5.2.0",
    "pandas>=2.3.2",
    "prometheus-client>=0.23.1",
    "pyarrow>=21.0.0",
    "pydantic-ai-slim[openai]==1.26.0",
    "pydantic-settings>=2.11.0",
    "rich>=14.2.0",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = ["pytest>=9.0.1", "pytest-asyncio>=1.3.0", "ruff>=0.14.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
